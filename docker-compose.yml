services:
  postgres:
    image: postgres:16-alpine
    container_name: agenthub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenthub}
      POSTGRES_USER: ${POSTGRES_USER:-agenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenthub}
    ports:
      # 5432 is commonly occupied by a local PostgreSQL installation.
      - "55432:5432"
    volumes:
      - agenthub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - agenthub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: agenthub-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - agenthub-qdrant-data:/qdrant/storage
    healthcheck:
      # The minimal Qdrant image has no curl/wget. Its entrypoint creates this
      # marker after storage initialization; the API health probe checks /readyz.
      test: ["CMD-SHELL", "test -f /qdrant/.qdrant-initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: agenthub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agenthub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agenthub-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agenthub-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agenthub-postgres-data:
  agenthub-redis-data:
  agenthub-qdrant-data:
  agenthub-minio-data:
